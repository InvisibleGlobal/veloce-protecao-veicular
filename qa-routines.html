<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="app/globals.css"><style>.page-header{display:none}</style><title>QA Rotinas</title></head><body>
<main class="app-stage"><section class="app-shell app-shell-routines"><header class="topbar">
<button class="brand"><img src="public/veloce-mark.svg"><span><strong>Veloce</strong><small>Central operacional</small></span></button>
<nav class="main-nav"><button><img class="svg-icon" src="public/icons/grid.svg" width="15" height="15"><span>Visão geral</span></button><button><img class="svg-icon" src="public/icons/flow.svg" width="15" height="15"><span>Esteira</span></button><button><img class="svg-icon" src="public/icons/users.svg" width="15" height="15"><span>Associados</span></button><button><img class="svg-icon" src="public/icons/network.svg" width="15" height="15"><span>Rede</span></button><button><img class="svg-icon" src="public/icons/file.svg" width="15" height="15"><span>Documentos</span></button><button class="active"><img class="svg-icon" src="public/icons/bolt.svg" width="15" height="15"><span>Rotinas</span></button></nav>
<div class="top-actions"><button class="icon-button search-trigger"><img class="svg-icon" src="public/icons/search.svg" width="16"><span class="shortcut">⌘K</span></button><button class="icon-button"><img class="svg-icon" src="public/icons/bell.svg" width="16"></button><button class="assistant-top"><img class="svg-icon" src="public/icons/command.svg" width="15"><span>Agente</span></button><button class="profile-button"><span>DV</span></button></div></header>
<div class="page-shell"><div class="routines-view"><section class="routine-intro panel"><div><span class="eyebrow">TRABALHO OPERACIONAL, SIMPLIFICADO</span><h2 class="section-title">O painel executa o trabalho repetitivo sem esconder o controle.</h2><p class="description">Cada rotina deixa claro o que será feito antes da execução.</p></div><button class="button button-dark"><img class="svg-icon" src="public/icons/command.svg" width="15">Pedir outra ação</button></section>
<section class="routine-grid">
<button class="routine-card"><span class="routine-icon"><img class="svg-icon" src="public/icons/documentCheck.svg" width="19"></span><span class="routine-copy"><strong class="card-title">Cobrar documentos</strong><small class="description">Identifica pendências, organiza a lista e dispara a cobrança.</small></span><span class="routine-arrow"><img class="svg-icon" src="public/icons/arrow.svg" width="15"></span></button>
<button class="routine-card routine-card-accent"><span class="routine-icon"><img class="svg-icon" src="public/icons/clock.svg" width="19"></span><span class="routine-copy"><strong class="card-title">Revisar SLAs</strong><small class="description">Separa riscos e atrasos para o time atuar primeiro no que importa.</small></span><span class="routine-arrow"><img class="svg-icon" src="public/icons/arrow.svg" width="15"></span></button>
<button class="routine-card"><span class="routine-icon"><img class="svg-icon" src="public/icons/route.svg" width="19"></span><span class="routine-copy"><strong class="card-title">Distribuir rede</strong><small class="description">Compara região, capacidade e prazo antes de sugerir prestadores.</small></span><span class="routine-arrow"><img class="svg-icon" src="public/icons/arrow.svg" width="15"></span></button>
<button class="routine-card"><span class="routine-icon"><img class="svg-icon" src="public/icons/scan.svg" width="19"></span><span class="routine-copy"><strong class="card-title">Triar entradas</strong><small class="description">Organiza novos eventos e sinaliza o que precisa de validação humana.</small></span><span class="routine-arrow"><img class="svg-icon" src="public/icons/arrow.svg" width="15"></span></button>
<button class="routine-card"><span class="routine-icon"><img class="svg-icon" src="public/icons/report.svg" width="19"></span><span class="routine-copy"><strong class="card-title">Gerar relatório</strong><small class="description">Consolida volume, SLA, etapas e pendências em um resumo executivo.</small></span><span class="routine-arrow"><img class="svg-icon" src="public/icons/arrow.svg" width="15"></span></button>
<button class="routine-card"><span class="routine-icon"><img class="svg-icon" src="public/icons/users.svg" width="19"></span><span class="routine-copy"><strong class="card-title">Revisar cadastros</strong><small class="description">Aponta dados incompletos antes que eles virem gargalo na operação.</small></span><span class="routine-arrow"><img class="svg-icon" src="public/icons/arrow.svg" width="15"></span></button>
</section></div></div></section></main></body></html>
